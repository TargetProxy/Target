name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Target
        uses: actions/checkout@v4
        with:
          path: Target
      - name: Checkout TargetLib
        uses: actions/checkout@v4
        with:
          repository: TargetProxy/TargetLib
          path: TargetLib
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: TargetLib/go.sum
      - name: Build TargetLib
        working-directory: TargetLib
        run: go build -trimpath -buildvcs=false -o build/TargetLib.exe ./cmd/TargetLib
      - name: Get Flutter dependencies
        working-directory: Target
        run: flutter pub get
      - name: Build Windows
        working-directory: Target
        run: flutter build windows --release

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Target
        uses: actions/checkout@v4
        with:
          path: Target
      - name: Checkout TargetLib
        uses: actions/checkout@v4
        with:
          repository: TargetProxy/TargetLib
          path: TargetLib
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: TargetLib/go.sum
      - name: Build TargetLib
        working-directory: TargetLib
        run: go build -trimpath -buildvcs=false -o build/TargetLib ./cmd/TargetLib
      - name: Get Flutter dependencies
        working-directory: Target
        run: flutter pub get
      - name: Build Linux
        working-directory: Target
        run: flutter build linux --release

  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Target
        uses: actions/checkout@v4
        with:
          path: Target
      - name: Checkout TargetLib
        uses: actions/checkout@v4
        with:
          repository: TargetProxy/TargetLib
          path: TargetLib
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: TargetLib/go.sum
      - name: Get Flutter dependencies
        working-directory: Target
        run: flutter pub get
      - name: Build Android
        working-directory: Target
        run: flutter build apk --debug

  build-apple:
    runs-on: macos-14
    steps:
      - name: Checkout Target
        uses: actions/checkout@v4
        with:
          path: Target
      - name: Checkout TargetLib
        uses: actions/checkout@v4
        with:
          repository: TargetProxy/TargetLib
          path: TargetLib
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: TargetLib/go.sum
      - name: Generate Apple projects
        working-directory: Target
        run: flutter create --platforms=macos,ios .
      - name: Get Flutter dependencies
        working-directory: Target
        run: flutter pub get
      - name: Build macOS
        working-directory: Target
        run: flutter build macos --release
      - name: Build iOS without signing
        working-directory: Target
        run: flutter build ios --release --no-codesign
