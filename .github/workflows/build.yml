name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targetlib:
    name: TargetLib ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            artifactName: targetlib-windows
            artifactPath: TargetLib/build
            buildCommand: ./scripts/build.ps1 -OutputPath build/TargetLib.exe -SkipTargetSync
          - target: linux
            os: ubuntu-latest
            artifactName: targetlib-linux
            artifactPath: TargetLib/build
            buildCommand: ./scripts/build.ps1 -OutputPath build/TargetLib -SkipTargetSync
          - target: android
            os: ubuntu-latest
            artifactName: targetlib-android
            artifactPath: TargetLib/flutter/android/src/main/jniLibs
            buildCommand: ./scripts/build-mobile.ps1

    steps:
      - name: Checkout TargetLib
        uses: actions/checkout@v4
        with:
          repository: TargetProxy/TargetLib
          path: TargetLib

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: TargetLib/go.sum

      - name: Build TargetLib
        working-directory: TargetLib
        shell: pwsh
        run: ${{ matrix.buildCommand }}

      - name: Upload TargetLib
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: targetlib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            libArtifact: targetlib-windows
            libPath: TargetLib/build
            artifactName: TargetSetup
            artifactPath: Target/build/windows/installer/TargetSetup.exe
          - target: linux
            os: ubuntu-latest
            libArtifact: targetlib-linux
            libPath: TargetLib/build
            artifactName: Target-linux-x64
            artifactPath: Target/build/linux/stage/Target-*.tar.gz
          - target: apk
            os: ubuntu-latest
            libArtifact: targetlib-android
            libPath: TargetLib/flutter/android/src/main/jniLibs
            artifactName: Target-android
            artifactPath: Target/build/apk/stage/*.apk
          - target: macos
            os: macos-latest
            artifactName: Target-macos-arm64
            artifactPath: Target/build/macos/stage/Target-*.tar.gz
          - target: ios
            os: macos-latest
            artifactName: Target-ios
            artifactPath: Target/build/ios/stage/Target-*.tar.gz

    steps:
      - name: Checkout Target
        uses: actions/checkout@v4
        with:
          path: Target

      - name: Checkout TargetLib
        uses: actions/checkout@v4
        with:
          repository: TargetProxy/TargetLib
          path: TargetLib

      - name: Download TargetLib
        if: matrix.libArtifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.libArtifact }}
          path: ${{ matrix.libPath }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: Target
        shell: pwsh
        run: ./scripts/install-deps.ps1

      - name: Install Inno Setup
        if: matrix.target == 'windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true

      - name: Setup Java
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build platform
        working-directory: Target
        shell: pwsh
        run: ./scripts/build.ps1 -Target "${{ matrix.target }}"

      - name: Stage package
        working-directory: Target
        shell: pwsh
        run: ./scripts/stage.ps1 -Target "${{ matrix.target }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
