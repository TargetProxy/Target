name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            target: windows
            targetlib: true
            stage: true
            artifactName: TargetSetup
            artifactPath: Target/build/windows/installer/TargetSetup.exe
          - name: Linux
            os: ubuntu-24.04
            target: linux
            targetlib: true
            stage: true
            artifactName: Target-linux-x64
            artifactPath: Target/build/linux/stage/Target-*.tar.gz
          - name: Android
            os: ubuntu-24.04
            target: apk
            java: true
            stage: true
            artifactName: Target-android
            artifactPath: Target/build/apk/stage/*.apk
          - name: macOS
            os: macos-14
            target: macos
            stage: true
            artifactName: Target-macos-arm64
            artifactPath: Target/build/macos/stage/Target-*.tar.gz
          - name: iOS
            os: macos-14
            target: ios
            stage: true
            artifactName: Target-ios
            artifactPath: Target/build/ios/stage/Target-*.tar.gz

    steps:
      - name: Checkout Target
        uses: actions/checkout@v4
        with:
          path: Target

      - name: Checkout TargetLib
        uses: actions/checkout@v4
        with:
          repository: TargetProxy/TargetLib
          path: TargetLib

      - name: Install Linux build dependencies
        working-directory: Target
        shell: pwsh
        run: ./scripts/install-deps.ps1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        if: matrix.java == true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: TargetLib/go.sum

      - name: Build TargetLib
        if: matrix.targetlib == true
        working-directory: TargetLib
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTargetSync

      - name: Build platform
        working-directory: Target
        shell: pwsh
        run: ./scripts/build.ps1 -Target "${{ matrix.target }}"

      - name: Install Inno Setup
        if: matrix.target == 'windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Stage package
        if: matrix.stage == true
        working-directory: Target
        shell: pwsh
        run: ./scripts/stage.ps1 -Target "${{ matrix.target }}"

      - name: Upload package
        if: matrix.stage == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
