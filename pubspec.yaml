name: target
description: Flutter desktop client for Target, backed by Libbox.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  grpc: ^5.1.0
  lottie: ^3.5.1
  package_info_plus: ^10.2.0
  path_provider: ^2.1.6
  protobuf: ^6.0.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

  material_ui: any
  talker: ^5.1.20
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - windows/runner/resources/app_icon.ico
