name: target
description: Flutter desktop client for Target, backed by TargetLib.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_alone: ^4.1.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  grpc: ^5.1.0
  intl: ^0.20.2
  lottie: ^3.5.1
  path: ^1.9.1
  protobuf: ^6.0.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

  material_ui: any
  talker: ^5.1.20
  targetlib:
    path: ../TargetLib/flutter
  syncfusion_flutter_maps: ^34.2.4
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  country_flags: ^4.1.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/TargetAppIcon.png
    - assets/maps/world_map.json
    - windows/runner/resources/app_icon.ico

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#24292f"
  image_path: assets/TargetAppIcon.png
  macos:
    generate: true
    image_path: assets/TargetAppIcon.png
  windows:
    generate: true
    image_path: assets/TargetAppIcon.png
    icon_size: 256
