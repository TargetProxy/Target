name: target
description: Flutter desktop client for Target, backed by TargetLib.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^18.0.0
  grpc: ^5.1.0
  intl: ^0.20.2
  protobuf: ^6.0.0

  material_ui: any
  talker: ^5.1.20
  targetlib:
    path: ../TargetLib/flutter
  syncfusion_flutter_maps: ^35.1.37
  syncfusion_flutter_charts: ^35.1.37
  shared_preferences: ^2.5.5
  proxy_manager: ^0.0.3
  country_flags: ^4.1.2
  tray_manager: ^0.7.0
  flutter_alone: ^4.1.0
  window_manager: ^0.5.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/TargetAppIcon.png
    - assets/services/openai.png
    - assets/maps/world_map.json

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#24292f"
  image_path: assets/TargetAppIcon.png
  macos:
    generate: true
    image_path: assets/TargetAppIcon.png
  windows:
    generate: true
    image_path: assets/TargetAppIcon.png
    icon_size: 256
